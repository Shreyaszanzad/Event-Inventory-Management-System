# In-memory H2 database for quick local end-to-end testing (no MySQL required).
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Data lives only in memory and resets on every restart.
spring.datasource.url=jdbc:h2:mem:eventinventory;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
