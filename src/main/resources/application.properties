spring.application.name=event-inventory
server.port=8080

# ===== Database (MySQL) =====
# createDatabaseIfNotExist gets you running fast; Achal owns the real schema later.
spring.datasource.url=jdbc:mysql://localhost:3306/event_inventory?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
# Credentials come from env vars in real setups; the fallbacks are DEV ONLY.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===== JPA / Hibernate =====
# 'update' lets Hibernate auto-create tables during development.
# Switch to 'validate' once Achal's DDL is the source of truth.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Secret is read from the JWT_SECRET env var in real deployments; the fallback is DEV ONLY.
# Must be >= 32 chars (256-bit). Generate one with:  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:CHANGE-ME-event-inventory-super-secret-key-please-rotate-0123456789}
app.jwt.expiration-ms=86400000

# ===== OTP (mocked for now) =====
# When true, the generated OTP is returned in the API response + logged (dev only).
app.otp.mock-enabled=true
app.otp.expiry-minutes=5
# Abuse protection
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.request-limit-per-window=5
app.otp.request-window-minutes=15

# ===== Auth throttling =====
app.security.login-limit-per-window=10
app.security.login-window-minutes=15

# ===== Booking holds =====
# How long a booking holds its seats awaiting payment before auto-release.
app.booking.hold-minutes=10
# Expiry sweeper cadence (ms). initial delay keeps it quiet during short test runs.
app.booking.sweeper-ms=60000
app.booking.sweeper-initial-ms=60000

# ===== CORS (frontend origins allowed to call the API; comma-separated) =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===== Seed admin (created on first startup if missing) =====
# DEV fallbacks only — override with env vars (and change them) for anything real.
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@eims.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.admin-name=${SEED_ADMIN_NAME:Super Admin}
